[workspace]
members = [".", "capi"]

[package]
name = "roadrunner_nitro"
version = "0.1.0"
edition = "2021"

[lib]
name = "roadrunner_nitro"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.30", features = ["extension-module", "abi3-py39"], optional = true }
numpy = { version = "0.30", optional = true }
rayon = "1.12"
# Antimony -> SBML in pure Rust (copied from sys-bio/PathwayDesigner-rs, see crates/UPSTREAM)
# DAE models (algebraic states, singular mass matrix) only: BDF with consistent initial conditions
diffsol = { version = "0.20", default-features = false, features = ["nalgebra"] }
antimony = { package = "antimony-rs", path = "crates/antimony", features = ["sbml"] }
cranelift-codegen = "0.137"
cranelift-frontend = "0.137"
cranelift-jit = "0.137"
cranelift-module = "0.137"
cranelift-native = "0.137"

[features]
default = []
python = ["dep:pyo3", "dep:numpy"]

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
